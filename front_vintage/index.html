
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vintage / OmniStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <section id="telaLogin">
    <form id="formLogin">
      <h1>Vintage / OmniStore</h1>

      <input id="loginEmail" type="email" placeholder="E-mail" required>
      <input id="loginSenha" type="password" placeholder="Senha" required>

      <button type="submit">Entrar</button>

      <p id="erroLogin"></p>

      <button type="button" id="btnMostrarCadastro">
        Criar conta
      </button>
    </form>

    <form id="formCadastro" hidden>
      <h2>Criar conta</h2>

      <input id="cadNome" type="text" placeholder="Nome completo" required>
      <input id="cadEmail" type="email" placeholder="E-mail" required>
      <input id="cadSenha" type="password" placeholder="Senha (mínimo 6 caracteres)" minlength="6" required>

      <button type="submit">Cadastrar</button>

      <button type="button" id="btnVoltarLogin">
        Voltar ao login
      </button>

      <p id="erroCadastro"></p>
    </form>
  </section>

  <section id="telaApp" hidden>
    <header>
      <strong>Vintage / OmniStore</strong>
      <span id="infoUsuario"></span>
      <button type="button" onclick="sair()">Sair</button>
    </header>

    <nav id="menu"></nav>
    <main id="conteudo"></main>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const login = document.getElementById('formLogin');
      const cadastro = document.getElementById('formCadastro');
      const mostrar = document.getElementById('btnMostrarCadastro');
      const voltar = document.getElementById('btnVoltarLogin');

      mostrar.addEventListener('click', function () {
        login.hidden = true;
        cadastro.hidden = false;
      });

      voltar.addEventListener('click', function () {
        cadastro.hidden = true;
        login.hidden = false;
      });
    });
  </script>

</body>
</html>
